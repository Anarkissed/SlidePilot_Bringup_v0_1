; SlidePilot Bring-up (minimal)
; Target: LilyGO T-Display S3 (ESP32-S3) using LovyanGFX
; This project initializes the display + reads inputs + shows AS5600 status.

[platformio]
default_envs = tdisplay_s3

[env:tdisplay_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; PSRAM is present on some variants. Safe to enable.
board_build.psram = enabled

build_flags =
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  lovyan03/LovyanGFX@^1.2.7