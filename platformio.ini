; SlidePilot Bring-up
; Target: LilyGO T-Display S3 (ESP32-S3) using LovyanGFX

[platformio]
default_envs = tdisplay_s3

[env:tdisplay_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.psram = enabled

; Optional: allows loading Roboto TTF from LittleFS at runtime.
; If you do not upload a filesystem image, the firmware will safely fall back
; to built-in fonts.
board_build.filesystem = littlefs

lib_deps =
  lovyan03/LovyanGFX@^1.2.7