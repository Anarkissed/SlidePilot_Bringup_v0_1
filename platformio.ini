; SlidePilot Bring-up
; Target: LilyGO T-Display S3 (ESP32-S3) using LovyanGFX

[platformio]
default_envs = tdisplay_s3

[env:tdisplay_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.psram = enabled

; Build ONLY src/main.cpp while we validate the LCD.
; After the screen works, delete this src_filter to build the full project again.
; src_filter =
;  -<*>
;  +<main.cpp>

lib_deps =
  lovyan03/LovyanGFX@^1.2.7